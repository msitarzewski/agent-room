            slug: {type: string}
            status: {type: string}
            source: {$ref: "#/components/schemas/Source"}
            source_status: {type: string}
            source_observed_at: {type: string, format: date-time}
            source_observation: {$ref: "#/components/schemas/ProjectObservation"}
            source_last_successful_collection_at: {type: string, format: date-time}
    Host:
      allOf:
        - {$ref: "#/components/schemas/ResourceBase"}
        - type: object
