openapi: 3.1.0
info:
  title: Agent Room API
  version: 1.0.0
  description: Canonical founding-release HTTP contract. Commands mutate state; events record accepted facts.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - {name: Authentication, description: Browser session lifecycle}
  - {name: Coordination, description: Human and agent coordination state}
  - {name: Resources, description: Project-scoped resource projections}
  - {name: Control, description: Versioned and auditable commands}
  - {name: Adapter, description: Service-token authenticated runtime ingestion}
  - {name: Realtime, description: Cursor-based project activity}
paths:
  /auth/login:
    get:
      operationId: beginOIDCLogin
      summary: Begin OIDC login
      tags: [Authentication]
      security: []
      parameters:
        - {name: return_to, in: query, description: Same-origin path to resume after authentication, schema: {type: string}}
      responses:
        "302": {description: Redirect to the configured OIDC provider}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/UnexpectedResponse"}
  /auth/callback:
    get:
      operationId: completeOIDCLogin
      summary: Complete OIDC login
      tags: [Authentication]
      security: []
      parameters:
        - {name: state, in: query, required: true, description: Bound OIDC state, schema: {type: string, minLength: 1}}
        - {name: code, in: query, required: true, description: OIDC authorization code, schema: {type: string, minLength: 1}}
      responses:
        "303": {description: Session created and browser redirected}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/UnexpectedResponse"}
  /auth/dev-login:
    post:
      operationId: createDevelopmentSession
      summary: Create a development-only password session
      description: Available only when the daemon is explicitly running in development mode.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, minLength: 1}
                password: {type: string, minLength: 1}
              additionalProperties: false
      responses:
        "200":
          description: Development session created
          content: {application/json: {schema: {$ref: "#/components/schemas/SessionEnvelope"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /auth/session:
    get:
      operationId: getSession
      summary: Get the current browser session
      description: Returns the actor and the stable session-bound CSRF token.
      tags: [Authentication]
      responses:
        "200":
          description: Active session
          content: {application/json: {schema: {$ref: "#/components/schemas/SessionEnvelope"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /auth/logout:
    post:
      operationId: revokeSession
      summary: Revoke the current browser session
      tags: [Authentication]
      parameters:
        - {$ref: "#/components/parameters/CSRF"}
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /projects:
    get:
      operationId: listProjects
      summary: List projects available to the current actor
      tags: [Coordination]
      responses:
        "200":
          description: Available projects and project-scoped capabilities
          content: {application/json: {schema: {$ref: "#/components/schemas/ProjectSummaryPage"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /overview:
    get:
      operationId: getProjectOverview
      summary: Get project resource counts and latest cursor
      tags: [Coordination]
      parameters:
        - {$ref: "#/components/parameters/Project"}
      responses:
        "200":
          description: Project overview
          content: {application/json: {schema: {$ref: "#/components/schemas/ProjectOverview"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /brief:
    get:
      operationId: getReturnBrief
      summary: Get deterministic changes since the actor reviewed this project
      tags: [Coordination]
      parameters:
        - {$ref: "#/components/parameters/Project"}
        - {name: after, in: query, description: Optional bounded replay override, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        "200":
          description: Actor- and project-scoped return brief
          content: {application/json: {schema: {$ref: "#/components/schemas/ProjectBrief"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /brief/acknowledge:
    post:
      operationId: acknowledgeReturnBrief
      summary: Advance the actor's reviewed project cursor
      tags: [Coordination]
      parameters:
        - {$ref: "#/components/parameters/Project"}
        - {$ref: "#/components/parameters/CSRF"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_cursor, through_cursor]
              properties:
                expected_cursor: {type: integer, format: int64, minimum: 0}
                through_cursor: {type: integer, format: int64, minimum: 0}
              additionalProperties: false
      responses:
        "200":
          description: Reviewed cursor advanced or idempotently replayed
          content: {application/json: {schema: {$ref: "#/components/schemas/BriefAcknowledgement"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /health/components:
    get:
      operationId: getComponentHealth
      summary: Get role-safe component health
      tags: [Coordination]
      parameters:
        - {$ref: "#/components/parameters/Project"}
      responses:
        "200":
          description: Component health snapshot
          content: {application/json: {schema: {$ref: "#/components/schemas/HealthSnapshot"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /agents:
    get:
      operationId: listAgents
      summary: List project agents
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/AgentList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /agents/{id}:
    get:
      operationId: getAgent
      summary: Get a project agent
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/AgentItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /runs:
    get:
      operationId: listRuns
      summary: List project runs
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/RunList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /runs/{id}:
    get:
      operationId: getRun
      summary: Get a project run
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/RunItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /sessions:
    get:
      operationId: listWorkSessions
      summary: List project work sessions
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/WorkSessionList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /sessions/{id}:
    get:
      operationId: getWorkSession
      summary: Get a project work session
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/WorkSessionItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /tasks:
    get:
      operationId: listTasks
      summary: List project tasks
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/TaskList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /tasks/{id}:
    get:
      operationId: getTask
      summary: Get a project task
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/TaskItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /attention:
    get:
      operationId: listAttention
      summary: List project attention items
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/AttentionList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /attention/{id}:
    get:
      operationId: getAttention
      summary: Get a project attention item
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/AttentionItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /evidence:
    get:
      operationId: listEvidence
      summary: List project evidence
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/EvidenceList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /evidence/{id}:
    get:
      operationId: getEvidence
      summary: Get project evidence
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/EvidenceItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /artifacts:
    get:
      operationId: listArtifacts
      summary: List project artifact metadata
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/ArtifactList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
    post:
      operationId: uploadArtifact
      summary: Upload an immutable content-addressed artifact
      tags: [Control]
      parameters:
        - {$ref: "#/components/parameters/Project"}
        - {$ref: "#/components/parameters/CSRF"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: task_id, in: query, description: Associated task identifier, schema: {type: string}}
        - {name: run_id, in: query, description: Associated run identifier, schema: {type: string}}
        - {name: X-Artifact-Name, in: header, required: true, description: Safe download filename, schema: {type: string, minLength: 1, maxLength: 255}}
      requestBody:
        required: true
        content:
          application/octet-stream: {schema: {type: string, format: binary}}
          text/plain: {schema: {type: string}}
          application/json: {schema: {}}
      responses:
        "201": {$ref: "#/components/responses/ArtifactItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /artifacts/{id}:
    get:
      operationId: getArtifact
      summary: Get project artifact metadata
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/ArtifactItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /artifacts/{id}/content:
    get:
      operationId: downloadArtifact
      summary: Download integrity-checked artifact content
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses:
        "200":
          description: Verified artifact bytes with digest ETag
          headers:
            ETag: {description: Content digest, schema: {type: string}}
            Content-Disposition: {description: Attachment filename, schema: {type: string}}
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /approvals:
    get:
      operationId: listApprovals
      summary: List project approvals
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/ApprovalList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
    post:
      operationId: requestRunApproval
      summary: Request approval for a destructive run action
      tags: [Control]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/CSRF"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, action, expected_target_version, expires_in_seconds]
              properties:
                run_id: {type: string, minLength: 1}
                action: {type: string, enum: [cancel]}
                message: {type: string}
                expected_target_version: {type: integer, format: int64, minimum: 1}
                expires_in_seconds: {type: integer, format: int64, minimum: 1, maximum: 86400}
              additionalProperties: false
      responses:
        "201": {$ref: "#/components/responses/ApprovalItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /approvals/{id}:
    get:
      operationId: getApproval
      summary: Get a project approval
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/ApprovalItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /interventions:
    get:
      operationId: listInterventions
      summary: List project interventions
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/InterventionList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /interventions/{id}:
    get:
      operationId: getIntervention
      summary: Get a project intervention
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/InterventionItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /budgets:
    get:
      operationId: listBudgets
      summary: List project budgets
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/BudgetList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /budgets/{id}:
    get:
      operationId: getBudget
      summary: Get a project budget
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/BudgetItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /claims:
    get:
      operationId: listClaims
      summary: List project claims
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/ClaimList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /claims/{id}:
    get:
      operationId: getClaim
      summary: Get a project claim
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/ClaimItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /audit:
    get:
      operationId: listAuditRecords
      summary: List project audit records
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/AuditRecordList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /audit/{id}:
    get:
      operationId: getAuditRecord
      summary: Get a project audit record
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/AuditRecordItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /chat/messages:
    get:
      operationId: listChatMessages
      summary: List project chat messages
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/ChatMessageList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
    post:
      operationId: createChatMessage
      summary: Send a project chat message
      tags: [Control]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/CSRF"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                session_id: {type: string}
                run_id: {type: string}
                body: {type: string, minLength: 1}
                metadata: {}
              additionalProperties: false
      responses:
        "201": {$ref: "#/components/responses/ChatMessageItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /chat/messages/{id}:
    get:
      operationId: getChatMessage
      summary: Get a project chat message
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}]
      responses: {"200": {$ref: "#/components/responses/ChatMessageItem"}, "400": {$ref: "#/components/responses/BadRequest"}, "404": {$ref: "#/components/responses/NotFound"}}
  /events:
    get:
      operationId: listEvents
      summary: List cursor-ordered project events
      tags: [Realtime]
      parameters:
        - {$ref: "#/components/parameters/Project"}
        - {name: cursor, in: query, description: Return events strictly after this cursor, schema: {type: integer, format: int64, minimum: 0}}
        - {$ref: "#/components/parameters/EventLimit"}
      responses:
        "200":
          description: Cursor-ordered event page
          content: {application/json: {schema: {$ref: "#/components/schemas/EventPage"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /tasks/{id}/transition:
    post:
      operationId: transitionTask
      summary: Transition a task with optimistic concurrency
      tags: [Control]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/CSRF"}, {$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: "#/components/schemas/TaskStatus"}
                reason: {type: string}
              additionalProperties: false
      responses:
        "200": {$ref: "#/components/responses/TaskItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
  /attention/{id}/acknowledge:
    post:
      operationId: acknowledgeAttention
      summary: Acknowledge an attention item
      tags: [Control]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/CSRF"}, {$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/IfMatch"}]
      responses:
        "200": {$ref: "#/components/responses/AttentionItem"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
  /attention/{id}/resolve:
    post:
      operationId: resolveAttention
      summary: Resolve an attention item
      tags: [Control]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/CSRF"}, {$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/IfMatch"}]
      responses:
        "200": {$ref: "#/components/responses/AttentionItem"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
  /runs/{id}/actions:
    post:
      operationId: controlRun
      summary: Queue control for a live managed run
      tags: [Control]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/CSRF"}, {$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [pause, resume, cancel, message, redirect]}
                message: {type: string}
                approval_id: {type: string}
              additionalProperties: false
      responses:
        "200": {$ref: "#/components/responses/RunItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
  /claims/{id}/review:
    post:
      operationId: reviewClaim
      summary: Review an agent claim
      tags: [Control]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/CSRF"}, {$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [accepted, rejected]}
                note: {type: string}
              additionalProperties: false
      responses:
        "200": {$ref: "#/components/responses/ClaimItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
  /approvals/{id}/decision:
    post:
      operationId: decideApproval
      summary: Decide an approval request
      tags: [Control]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/CSRF"}, {$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected]}
                note: {type: string}
              additionalProperties: false
      responses:
        "200": {$ref: "#/components/responses/ApprovalItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
  /stream:
    get:
      operationId: streamProjectEvents
      summary: Open the project event WebSocket
      description: Upgrades to a server-push WebSocket carrying cursor-bearing event, heartbeat, and resync frames.
      tags: [Realtime]
      parameters:
        - {$ref: "#/components/parameters/Project"}
        - {name: after, in: query, description: Replay events strictly after this cursor, schema: {type: integer, format: int64, minimum: 0}}
      x-websocket-message:
        type: object
        required: [cursor, type, occurred_at]
        properties:
          cursor: {type: integer, format: int64, minimum: 0}
          type: {type: string, description: "Event type, heartbeat, or resync_required"}
          occurred_at: {type: string, format: date-time}
          data: {}
      responses:
        "101": {description: WebSocket protocol switched}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/UnexpectedResponse"}
  /ingest:
    post:
      operationId: ingestAdapterEvents
      summary: Ingest authenticated runtime events
      description: Adapter-only endpoint served by the private listener. Event identifiers and actor attribution are replaced by canonical server values.
      tags: [Adapter]
      security:
        - serviceToken: []
      parameters:
        - {$ref: "#/components/parameters/Project"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  items: {$ref: "#/components/schemas/IngestEvent"}
              additionalProperties: false
      responses:
        "202": {description: Events accepted}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /organizations:
