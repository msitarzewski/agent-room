          properties:
            kind: {type: string}
            fingerprint: {type: string}
            status: {type: string}
            severity: {type: string}
            summary: {type: string}
            detail: {type: string}
            material_hash: {type: string}
            occurrences: {type: integer, format: int64, minimum: 1}
            first_observed_at: {type: string, format: date-time}
            last_observed_at: {type: string, format: date-time}
            resolved_at: {type: string, format: date-time}
    Policy:
      allOf:
        - {$ref: "#/components/schemas/ResourceBase"}
        - type: object
          required: [name, kind, status, priority, rule]
          properties:
            name: {type: string}
            kind: {type: string}
            status: {type: string}
            priority: {type: integer}
            rule: {}
    Deployment:
      allOf:
        - {$ref: "#/components/schemas/ResourceBase"}
        - type: object
          required: [environment, host_id, release, commit, status]
          properties:
            environment: {type: string}
            host_id: {type: string}
            release: {type: string}
            commit: {type: string}
            status: {type: string}
            rollback_of: {type: string}
            deployed_at: {type: string, format: date-time}
    Event:
      type: object
      required: [id, cursor, project_id, type, subject_type, subject_id, actor_id, occurred_at, schema_version, payload]
      properties:
        id: {type: string}
        cursor: {type: integer, format: int64, minimum: 1}
        project_id: {type: string}
        type: {type: string}
        subject_type: {type: string}
        subject_id: {type: string}
        actor_id: {type: string}
        command_id: {type: string}
        correlation_id: {type: string}
        causation_id: {type: string}
        occurred_at: {type: string, format: date-time}
        schema_version: {type: integer, minimum: 1}
        source_system: {type: string}
        source_event_id: {type: string}
        source_sequence: {type: integer, format: int64}
        payload: {}
    AgentObservation:
      type: object
      additionalProperties: false
      required: [agent_id, instance_id, display_name, status, observed_at]
      properties:
        agent_id: {type: string, minLength: 1, maxLength: 512}
        instance_id: {type: string, minLength: 1, maxLength: 512}
        display_name: {type: string, minLength: 1, maxLength: 256}
        status: {type: string, enum: [active, idle, blocked, disconnected]}
        observed_at: {type: string, format: date-time}
    SessionObservation:
      type: object
      additionalProperties: false
      required: [agent_id, session_id, status, observed_at]
      properties:
        agent_id: {type: string, minLength: 1, maxLength: 512}
        session_id: {type: string, minLength: 1, maxLength: 512}
        status: {type: string, enum: [active, idle, closed]}
        observed_at: {type: string, format: date-time}
    RunObservation:
      type: object
      additionalProperties: false
      required: [agent_id, run_id, status, observed_at]
      properties:
        agent_id: {type: string, minLength: 1, maxLength: 512}
        run_id: {type: string, minLength: 1, maxLength: 512}
        status: {type: string, enum: [running, idle, blocked, completed, failed, cancelled]}
        observed_at: {type: string, format: date-time}
        session_id: {type: string, maxLength: 512}
        task_id: {type: string, maxLength: 512}
        summary: {type: string, maxLength: 4096}
    IngestEvent:
      type: object
      required: [project_id, type, subject_type, subject_id, source_system, source_event_id, payload]
      properties:
        project_id: {type: string}
        type: {type: string, pattern: "^[a-z][a-z0-9_.-]{0,127}$"}
        subject_type: {type: string, not: {const: coordination_request}}
        subject_id: {type: string, minLength: 1}
        correlation_id: {type: string}
        causation_id: {type: string}
        occurred_at: {type: string, format: date-time}
        schema_version: {type: integer, enum: [0, 1]}
        source_system: {type: string, pattern: "^[a-z][a-z0-9_.-]{0,63}$"}
        source_event_id: {type: string, minLength: 1, maxLength: 512}
        source_sequence: {type: integer, format: int64, minimum: 0}
        payload: {type: object, not: {properties: {resource: {}}, required: [resource]}}
      allOf:
        - if: {properties: {source_system: {enum: [sentry, github]}}, required: [source_system]}
          then:
            required: [source_sequence]
            properties:
              source_sequence: {type: integer, minimum: 1}
            oneOf:
              - properties:
                  type: {const: task.observed}
                  subject_type: {const: task}
                  payload: {$ref: "#/components/schemas/TaskObservation"}
              - properties:
                  type: {const: project.observed}
                  subject_type: {const: project}
                  payload: {$ref: "#/components/schemas/ProjectObservation"}
        - if:
            properties:
              source_system: {enum: [codex, claude, hermes]}
              type: {enum: [agent.observed, session.observed, run.observed]}
            required: [source_system, type]
          then:
            required: [source_sequence]
            properties:
              source_sequence: {type: integer, minimum: 1}
            oneOf:
              - properties:
                  type: {const: agent.observed}
