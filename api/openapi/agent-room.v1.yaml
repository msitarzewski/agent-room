      properties:
        system: {type: string}
        last_seen: {type: string, format: date-time, description: Backward-compatible alias of last_received_at.}
        last_received_at: {type: string, format: date-time, description: Most recent event receipt time in this project.}
        last_collected_at: {type: [string, "null"], format: date-time, description: Last accepted project collection; legacy task-only sources use event occurrence time.}
        last_successful_collection_at: {type: [string, "null"], format: date-time, description: Last accepted complete project collection.}
        scan_status: {type: [string, "null"], enum: [complete, partial, unreadable, null]}
        project_observation: {$ref: "#/components/schemas/ProjectObservation"}
    ProjectOverview:
      type: object
      required: [project_id, counts, event_cursor, generated_at, sources, coordination]
      properties:
        project_id: {type: string}
        counts: {type: object, additionalProperties: {type: integer, format: int64, minimum: 0}}
        sources: {type: array, items: {$ref: "#/components/schemas/SourceFreshness"}}
        coordination: {$ref: "#/components/schemas/CoordinationSummary"}
        event_cursor: {type: integer, format: int64, minimum: 0}
        generated_at: {type: string, format: date-time}
    BriefAcknowledgement:
      type: object
