      summary: List organizations
      tags: [Resources]
      parameters: [{$ref: "#/components/parameters/Project"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {$ref: "#/components/responses/OrganizationList"}, "400": {$ref: "#/components/responses/BadRequest"}, "403": {$ref: "#/components/responses/Forbidden"}}
  /organizations/{id}:
