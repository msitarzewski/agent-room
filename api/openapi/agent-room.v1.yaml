        "409": {$ref: "#/components/responses/Conflict"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
  /stream:
    get:
      operationId: streamProjectEvents
      summary: Open the project event WebSocket
      description: Upgrades to a server-push WebSocket carrying cursor-bearing event, heartbeat, and resync frames.
      tags: [Realtime]
      parameters:
        - {$ref: "#/components/parameters/Project"}
        - {name: after, in: query, description: Replay events strictly after this cursor, schema: {type: integer, format: int64, minimum: 0}}
      x-websocket-message:
        type: object
        required: [cursor, type, occurred_at]
        properties:
          cursor: {type: integer, format: int64, minimum: 0}
          type: {type: string, description: "Event type, heartbeat, or resync_required"}
          occurred_at: {type: string, format: date-time}
          data: {}
      responses:
        "101": {description: WebSocket protocol switched}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/UnexpectedResponse"}
  /ingest:
    post:
      operationId: ingestAdapterEvents
      summary: Ingest authenticated runtime events
      description: Available only on the private adapter listener. Payloads cannot contain resource replacements. Sentry and GitHub use typed task.observed or project.observed and a positive source_sequence; project observations require operator-preprovisioned projects and preserve canonical names, memberships and tasks; collection time is separate from delivery receipt; Narrow codex/claude/hermes source tokens accept only typed agent.observed/session.observed/run.observed; legacy event names require explicit source:admin authority; Task IDs are scoped by project and source from external_id, with legacy Sentry IDs preserved. Each source has an independent project report and freshness watermark. Source completion never accepts supervised completion. Later observations preserve supervisory fields. Blocked source work derives source.task.blocked attention; a newer nonblocked observation resolves only that source-owned item. Human resolution suppresses the same blocked episode until the source unblocks and blocks again. Event identifiers and actor attribution are replaced by canonical server values.
      tags: [Adapter]
      security:
        - serviceToken: []
      parameters:
        - {$ref: "#/components/parameters/Project"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  items: {$ref: "#/components/schemas/IngestEvent"}
              additionalProperties: false
      responses:
        "202": {description: Events accepted}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
