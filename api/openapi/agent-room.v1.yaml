          properties:
            hostname: {type: string}
            os: {type: string}
            arch: {type: string}
            status: {type: string}
            labels: {type: object, additionalProperties: {type: string}}
    AgentInstance:
      allOf:
        - {$ref: "#/components/schemas/ResourceBase"}
        - type: object
          required: [agent_id, host_id, runtime, status, started_at]
          properties:
            agent_id: {type: string}
            host_id: {type: string}
            runtime: {type: string}
            process_id: {type: integer}
            status: {type: string}
            started_at: {type: string, format: date-time}
            stopped_at: {type: string, format: date-time}
    Situation:
      allOf:
        - {$ref: "#/components/schemas/ResourceBase"}
